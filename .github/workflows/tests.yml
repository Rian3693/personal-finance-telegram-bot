name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tested modules use only the standard library, so the full bot
      # dependencies (Telegram, market data, AI SDKs) are not needed here.
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
